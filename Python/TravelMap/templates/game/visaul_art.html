<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="TravelMap - 赛博风旅行地图 Demo，涵盖 3D 地图、商城与路线规划体验。">
    <meta name="keywords" content="TravelMap, 旅行地图, 3D 地图, 安卓 Demo, AMap SDK">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:title" content="Visual Art Lab - 图片可视化艺术实验室">
    <meta property="og:description" content="TravelMap 安卓 Demo，展示地图、商城与路线规划。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url_root }}">
    <meta name="twitter:card" content="summary">
    <title>Visual Art Lab - 图片可视化艺术实验室</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    
    <!-- 1. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 引入 Babel (用于在浏览器中编译 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 自定义样式 -->
    <style>
        /* 隐藏滚动条但允许滚动 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React 代码逻辑 -->
    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // --- 图标组件 (SVG) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
            Layers: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
            Maximize: <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>,
            Minimize: <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>,
            Upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
            Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
            Play: <polygon points="5 3 19 12 5 21 5 3"/>,
            Pause: <><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>,
            Sliders: <><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></>,
            ImageIcon: <><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>
        };

        const LucideIcon = ({ name, className }) => <Icon path={Icons[name]} className={className} />;


        // --- 常量配置 ---
        const DEFAULT_CONFIG = {
            mode: 'mosaic',
            showOriginal: false,
            bgColor: '#111827',
            resolution: 12,
            brightness: 1.0,
            isAnimated: false,
            speed: 1.0,
            noise: 0,
            mosaicShape: 'circle',
            mosaicStroke: false,
            particleCount: 2000,
            particleSize: 2,
            mouseInteraction: 0.5,
            waveAmplitude: 20,
            lineThickness: 1,
        };

        const PRESETS = {
            '赛博霓虹 (Cyber Neon)': {
                mode: 'particles', bgColor: '#050505', resolution: 8, brightness: 1.4,
                isAnimated: true, speed: 1.5, particleCount: 3000, mouseInteraction: 0.8, noise: 10
            },
            '复古像素 (Retro Pixel)': {
                mode: 'mosaic', bgColor: '#f0f0f0', resolution: 16, brightness: 1.0,
                isAnimated: false, mosaicShape: 'rect', mosaicStroke: true
            },
            '模拟波形 (Analog Waves)': {
                mode: 'waves', bgColor: '#1a1a2e', resolution: 10, brightness: 1.2,
                isAnimated: true, speed: 0.5, waveAmplitude: 35, lineThickness: 2
            },
            '油画点彩 (Pointillism)': {
                mode: 'mosaic', bgColor: '#fffbf0', resolution: 8, brightness: 1.1,
                isAnimated: true, speed: 0.2, noise: 5, mosaicShape: 'circle', mosaicStroke: false
            },
            '量子力场 (Quantum Field)': {
                mode: 'particles', bgColor: '#000000', resolution: 10, brightness: 1.5,
                isAnimated: true, speed: 3.0, particleCount: 4500, particleSize: 1.5, mouseInteraction: 1.5, noise: 20
            },
            '黑白素描 (Sketch)': {
                mode: 'waves', bgColor: '#ffffff', resolution: 6, brightness: 0.8,
                isAnimated: false, waveAmplitude: 15, lineThickness: 1, speed: 0
            }
        };

        // --- 渲染引擎类 ---
        class Particle {
            constructor(width, height) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.size = 1;
                this.color = 'white';
                this.density = (Math.random() * 30) + 1;
            }

            update(mouse, width, height, config) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const maxDistance = 100;
                
                if (distance < maxDistance && mouse.active) {
                    const force = (maxDistance - distance) / maxDistance;
                    const directionX = (dx / distance) * force * this.density * config.mouseInteraction * 5;
                    const directionY = (dy / distance) * force * this.density * config.mouseInteraction * 5;
                    this.vx -= directionX;
                    this.vy -= directionY;
                }

                if (!mouse.active || distance > maxDistance) {
                    if (config.isAnimated) {
                        this.x += (Math.random() - 0.5) * config.speed;
                        this.y += (Math.random() - 0.5) * config.speed;
                        if(this.x < 0) this.x = width;
                        if(this.x > width) this.x = 0;
                        if(this.y < 0) this.y = height;
                        if(this.y > height) this.y = 0;
                    }
                }
                
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- 主组件 ---
        function App() {
            const [imageSrc, setImageSrc] = useState(null);
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [isSidebarOpen, setSidebarOpen] = useState(true);
            const [fps, setFps] = useState(0);
            const [imageDimensions, setImageDimensions] = useState({ w: 0, h: 0 });

            const canvasRef = useRef(null);
            const sourceCanvasRef = useRef(null);
            const containerRef = useRef(null);
            const requestRef = useRef();
            const particlesRef = useRef([]);
            const timeRef = useRef(0);
            const mouseRef = useRef({ x: 0, y: 0, active: false });

            // 图片上传处理
            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setImageSrc(event.target.result);
                            setImageDimensions({ w: img.width, h: img.height });
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            // 核心绘制循环
            const draw = useCallback(() => {
                const canvas = canvasRef.current;
                const srcCanvas = sourceCanvasRef.current;
                const container = containerRef.current;

                if (!canvas || !srcCanvas || !container || !imageSrc) return;

                const ctx = canvas.getContext('2d', { alpha: false });
                const srcCtx = srcCanvas.getContext('2d');
                
                if (!ctx || !srcCtx) return;

                // 适配尺寸
                const { clientWidth, clientHeight } = container;
                if (canvas.width !== clientWidth || canvas.height !== clientHeight) {
                    canvas.width = clientWidth;
                    canvas.height = clientHeight;
                }
                
                // 绘制并缩放原图到源 Canvas
                const scale = Math.min(canvas.width / imageDimensions.w, canvas.height / imageDimensions.h);
                const drawW = imageDimensions.w * scale;
                const drawH = imageDimensions.h * scale;
                const offsetX = (canvas.width - drawW) / 2;
                const offsetY = (canvas.height - drawH) / 2;

                if (srcCanvas.width !== canvas.width || srcCanvas.height !== canvas.height) {
                    srcCanvas.width = canvas.width;
                    srcCanvas.height = canvas.height;
                    const img = new Image();
                    img.src = imageSrc;
                    srcCtx.drawImage(img, offsetX, offsetY, drawW, drawH);
                }

                // 清空背景
                ctx.fillStyle = config.bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                timeRef.current += config.speed * 0.05;
                const sampleSize = Math.max(1, Math.floor(config.resolution));
                const imageData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
                const pixels = imageData.data;

                // --- 模式 A: 马赛克 ---
                if (config.mode === 'mosaic') {
                    for (let y = 0; y < canvas.height; y += sampleSize) {
                        for (let x = 0; x < canvas.width; x += sampleSize) {
                            const i = (y * canvas.width + x) * 4;
                            if (pixels[i+3] < 10) continue;

                            let r = pixels[i] * config.brightness;
                            let g = pixels[i+1] * config.brightness;
                            let b = pixels[i+2] * config.brightness;

                            if (config.noise > 0 && config.isAnimated) {
                                const noise = (Math.random() - 0.5) * config.noise * 10;
                                r += noise; g += noise; b += noise;
                            }

                            ctx.fillStyle = `rgb(${r},${g},${b})`;
                            if (config.mosaicStroke) {
                                ctx.strokeStyle = `rgba(${r},${g},${b},0.5)`;
                                ctx.lineWidth = 1;
                            }

                            const size = sampleSize * 0.9;
                            if (config.mosaicShape === 'circle') {
                                ctx.beginPath();
                                ctx.arc(x + sampleSize/2, y + sampleSize/2, size/2, 0, Math.PI*2);
                                ctx.fill();
                                if(config.mosaicStroke) ctx.stroke();
                            } else if (config.mosaicShape === 'hex') {
                                ctx.beginPath();
                                ctx.arc(x + sampleSize/2, y + sampleSize/2, size/2, 0, Math.PI*2);
                                ctx.fill();
                            } else {
                                ctx.fillRect(x, y, size, size);
                                if(config.mosaicStroke) ctx.strokeRect(x, y, size, size);
                            }
                        }
                    }
                }
                // --- 模式 B: 粒子 ---
                else if (config.mode === 'particles') {
                    if (particlesRef.current.length !== config.particleCount) {
                        particlesRef.current = [];
                        for (let i = 0; i < config.particleCount; i++) {
                            particlesRef.current.push(new Particle(canvas.width, canvas.height));
                        }
                    }

                    particlesRef.current.forEach(p => {
                        const px = Math.floor(p.x);
                        const py = Math.floor(p.y);
                        if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                            const i = (py * canvas.width + px) * 4;
                            if (pixels[i+3] > 10) {
                                const r = pixels[i];
                                const g = pixels[i+1];
                                const b = pixels[i+2];
                                const brightness = (r + g + b) / 3;
                                p.color = `rgb(${r},${g},${b})`;
                                p.size = config.particleSize * (brightness / 255) * 2;
                            } else {
                                p.color = 'rgba(0,0,0,0)';
                            }
                        }
                        p.update(mouseRef.current, canvas.width, canvas.height, config);
                        p.draw(ctx);
                    });
                }
                // --- 模式 C: 波形 ---
                else if (config.mode === 'waves') {
                    const stepY = Math.max(4, config.resolution);
                    ctx.lineWidth = config.lineThickness;

                    for (let y = 0; y < canvas.height; y += stepY) {
                        ctx.beginPath();
                        let hasStarted = false;

                        for (let x = 0; x < canvas.width; x += Math.max(2, config.resolution / 2)) {
                            const i = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                            if (pixels[i+3] < 10) {
                                if(hasStarted) ctx.stroke();
                                hasStarted = false;
                                continue;
                            }

                            const r = pixels[i];
                            const g = pixels[i+1];
                            const b = pixels[i+2];
                            const brightness = (r + g + b) / 3 / 255;

                            const waveY = y - (brightness * config.waveAmplitude) + 
                                        (config.isAnimated ? Math.sin(x * 0.05 + timeRef.current) * 5 : 0);

                            ctx.strokeStyle = `rgba(${r},${g},${b}, ${config.brightness})`;
                            
                            if (!hasStarted) {
                                ctx.moveTo(x, waveY);
                                hasStarted = true;
                            } else {
                                ctx.lineTo(x, waveY);
                            }
                        }
                        ctx.stroke();
                    }
                }

                if (config.showOriginal) {
                    const thumbW = 150;
                    const thumbH = thumbW * (imageDimensions.h / imageDimensions.w);
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(20, 20, thumbW, thumbH);
                    ctx.drawImage(srcCanvas, 0, 0, srcCanvas.width, srcCanvas.height, 20, 20, thumbW, thumbH);
                }

            }, [config, imageSrc, imageDimensions]);

            useEffect(() => {
                let lastTime = performance.now();
                let frameCount = 0;
                const animate = () => {
                    if (config.isAnimated || config.mode === 'particles') {
                        draw();
                    } else {
                        if (frameCount % 30 === 0) draw();
                    }
                    frameCount++;
                    const now = performance.now();
                    if (now - lastTime >= 1000) {
                        setFps(frameCount);
                        frameCount = 0;
                        lastTime = now;
                    }
                    requestRef.current = requestAnimationFrame(animate);
                };
                if (imageSrc) {
                    requestRef.current = requestAnimationFrame(animate);
                }
                return () => cancelAnimationFrame(requestRef.current);
            }, [draw, config.isAnimated, config.mode, imageSrc]);

            const handleMouseMove = (e) => {
                const rect = containerRef.current?.getBoundingClientRect();
                if (rect) {
                    mouseRef.current = {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top,
                        active: true
                    };
                }
            };

            const handleMouseLeave = () => {
                mouseRef.current.active = false;
            };

            const applyPreset = (name) => {
                const preset = PRESETS[name];
                if (preset) setConfig(prev => ({ ...prev, ...preset }));
            };

            const downloadCanvas = () => {
                const canvas = canvasRef.current;
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = `art-lab-${Date.now()}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                }
            };

            const getModeName = (mode) => {
                switch(mode) {
                    case 'mosaic': return '马赛克';
                    case 'particles': return '粒子流';
                    case 'waves': return '声波纹';
                    default: return mode;
                }
            };

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 font-sans overflow-hidden selection:bg-cyan-500/30">
                    
                    {/* 左侧控制面板 */}
                    <aside className={`flex-shrink-0 bg-slate-900/90 backdrop-blur-md border-r border-slate-800 transition-all duration-300 flex flex-col ${isSidebarOpen ? 'w-80' : 'w-0 opacity-0 overflow-hidden'}`}>
                        <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-2 text-cyan-400 font-bold text-xl tracking-wider">
                                <LucideIcon name="Activity" className="w-6 h-6" />
                                <span>VISUAL LAB</span>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-8 custom-scrollbar">
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                    <LucideIcon name="Layers" className="w-3 h-3" /> 全局模式
                                </h3>
                                <div className="space-y-3">
                                    <div className="grid grid-cols-3 gap-2">
                                        {['mosaic', 'particles', 'waves'].map(m => (
                                            <button key={m} onClick={() => setConfig({ ...config, mode: m })}
                                                className={`py-2 text-xs rounded border transition-all ${config.mode === m ? 'bg-cyan-500/20 border-cyan-500 text-cyan-400' : 'bg-slate-800 border-transparent text-slate-400 hover:bg-slate-700'}`}>
                                                {getModeName(m)}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <label className="text-sm text-slate-400">画布背景</label>
                                        <input type="color" value={config.bgColor} onChange={(e) => setConfig({...config, bgColor: e.target.value})} className="w-8 h-8 rounded cursor-pointer bg-transparent border-0" />
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <label className="text-sm text-slate-400">显示原图</label>
                                        <button onClick={() => setConfig({...config, showOriginal: !config.showOriginal})} className={`w-10 h-5 rounded-full relative transition-colors ${config.showOriginal ? 'bg-cyan-600' : 'bg-slate-700'}`}>
                                            <div className={`absolute top-1 w-3 h-3 rounded-full bg-white transition-all ${config.showOriginal ? 'left-6' : 'left-1'}`} />
                                        </button>
                                    </div>
                                </div>
                            </section>

                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-3 flex items-center gap-2">
                                    <LucideIcon name="Sliders" className="w-3 h-3" /> 参数调整
                                </h3>
                                <div className="space-y-4">
                                    <RangeControl label="采样密度 / 分辨率" value={config.resolution} min={4} max={50} onChange={(v) => setConfig({...config, resolution: v})} />
                                    <RangeControl label="亮度增强" value={config.brightness} min={0.5} max={3} step={0.1} onChange={(v) => setConfig({...config, brightness: v})} />
                                    
                                    {config.mode === 'particles' && (
                                        <>
                                            <div className="h-px bg-slate-800 my-2" />
                                            <RangeControl label="粒子数量" value={config.particleCount} min={100} max={5000} step={100} onChange={(v) => setConfig({...config, particleCount: v})} />
                                            <RangeControl label="粒子大小" value={config.particleSize} min={1} max={10} step={0.5} onChange={(v) => setConfig({...config, particleSize: v})} />
                                            <RangeControl label="鼠标交互力度" value={config.mouseInteraction} min={0} max={2} step={0.1} onChange={(v) => setConfig({...config, mouseInteraction: v})} />
                                        </>
                                    )}
                                    {config.mode === 'mosaic' && (
                                        <>
                                            <div className="h-px bg-slate-800 my-2" />
                                            <div className="flex items-center justify-between text-sm text-slate-400 mb-2">
                                                <span>形状</span>
                                                <select value={config.mosaicShape} onChange={(e) => setConfig({...config, mosaicShape: e.target.value})} className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-500">
                                                    <option value="rect">方块</option>
                                                    <option value="circle">圆点</option>
                                                    <option value="hex">六边形</option>
                                                </select>
                                            </div>
                                            <div className="flex items-center justify-between text-sm text-slate-400">
                                                <span>描边</span>
                                                <input type="checkbox" checked={config.mosaicStroke} onChange={(e) => setConfig({...config, mosaicStroke: e.target.checked})} className="accent-cyan-500" />
                                            </div>
                                        </>
                                    )}
                                    {config.mode === 'waves' && (
                                        <>
                                            <div className="h-px bg-slate-800 my-2" />
                                            <RangeControl label="波形振幅" value={config.waveAmplitude} min={0} max={100} onChange={(v) => setConfig({...config, waveAmplitude: v})} />
                                            <RangeControl label="线条粗细" value={config.lineThickness} min={0.5} max={5} step={0.5} onChange={(v) => setConfig({...config, lineThickness: v})} />
                                        </>
                                    )}
                                </div>
                            </section>

                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-3">动画控制</h3>
                                <div className="space-y-4">
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="text-sm text-slate-400">状态</label>
                                        <button onClick={() => setConfig({...config, isAnimated: !config.isAnimated})} className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs transition-colors ${config.isAnimated ? 'bg-green-500/20 text-green-400' : 'bg-slate-800 text-slate-500'}`}>
                                            <LucideIcon name={config.isAnimated ? "Pause" : "Play"} className="w-3 h-3" />
                                            {config.isAnimated ? '运行中' : '已暂停'}
                                        </button>
                                    </div>
                                    {config.isAnimated && <RangeControl label="动画速度" value={config.speed} min={0} max={5} step={0.1} onChange={(v) => setConfig({...config, speed: v})} />}
                                </div>
                            </section>

                            <section>
                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-3">风格预设</h3>
                                <div className="grid grid-cols-1 gap-2">
                                    {Object.keys(PRESETS).map(key => (
                                        <button key={key} onClick={() => applyPreset(key)} className="text-left px-3 py-2 text-sm rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors flex items-center justify-between group">
                                            {key}
                                            <span className="opacity-0 group-hover:opacity-100 text-cyan-400 text-xs">应用</span>
                                        </button>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </aside>

                    {/* 右侧画布区 */}
                    <main className="flex-1 relative flex flex-col h-full overflow-hidden">
                        <header className="h-16 bg-slate-900/50 backdrop-blur border-b border-slate-800 flex items-center justify-between px-6 z-10">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 rounded-md hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
                                    <LucideIcon name={isSidebarOpen ? "Minimize" : "Maximize"} className="w-5 h-5" />
                                </button>
                                {!imageSrc && <span className="text-slate-500 text-sm">请上传图片以开始创作</span>}
                                {imageSrc && <span className="text-slate-400 text-xs font-mono px-2 py-1 bg-slate-800 rounded">{imageDimensions.w} x {imageDimensions.h} px | {fps} FPS</span>}
                            </div>
                            <div className="flex items-center gap-3">
                                <label className="cursor-pointer flex items-center gap-2 px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg shadow-lg shadow-cyan-500/20 transition-all text-sm font-medium">
                                    <LucideIcon name="Upload" className="w-4 h-4" />
                                    <span>上传图片</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                </label>
                                {imageSrc && (
                                    <button onClick={downloadCanvas} className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors" title="下载创作">
                                        <LucideIcon name="Download" className="w-5 h-5" />
                                    </button>
                                )}
                            </div>
                        </header>
                        <div ref={containerRef} className="flex-1 relative bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] bg-slate-950" onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}>
                            {!imageSrc && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-600 pointer-events-none">
                                    <div className="w-24 h-24 opacity-20 mb-4 text-white">
                                        <LucideIcon name="ImageIcon" className="w-full h-full" />
                                    </div>
                                    <p className="text-lg font-light">拖拽图片或点击上传</p>
                                </div>
                            )}
                            <canvas ref={sourceCanvasRef} className="hidden" />
                            <canvas ref={canvasRef} className="block w-full h-full object-contain" />
                        </div>
                    </main>
                </div>
            );
        }

        const RangeControl = ({ label, value, min, max, step = 1, onChange }) => (
            <div className="space-y-1">
                <div className="flex justify-between text-xs text-slate-400">
                    <span>{label}</span>
                    <span className="font-mono text-slate-500">{typeof value === 'number' ? value.toFixed(step < 1 ? 1 : 0) : value}</span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} className="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500" />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
