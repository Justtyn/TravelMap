<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPunk Neural Link</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 引入 Babel 用于在浏览器中编译 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 自定义动画样式 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 10s infinite ease-in-out;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        
        /* Marquee Animation */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            animation: scroll linear infinite;
        }
        .animate-scroll-reverse {
            animation: scroll linear infinite reverse;
        }
        
        /* 扫光动画 */
        @keyframes shimmer {
            100% { transform: translateX(200%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React 代码逻辑 -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 (内嵌 SVG 以避免依赖问题) ---
        const User = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const Mail = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        );
        const Lock = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        );
        const ArrowRight = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const Github = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        );
        const Twitter = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
        );
        const Globe = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        );
        const Fingerprint = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 12a3 3 0 0 1 3-3 3 3 0 0 1 3 3"/><path d="M14.7 19.6C14.32 18.1 14 15 14 12a2 2 0 0 0-2-2"/><path d="M15 12a5 5 0 0 1 6 3"/><path d="M15.82 22c.55-.93 1.2-2.18 1.4-3.3"/><path d="M19.1 17c.2 0 .4.1.6.3"/><path d="M21 15c.66.75 1.2 1.63 1.6 2.6"/></svg>
        );

        // --- 主程序 ---

        function App() {
            const [isLogin, setIsLogin] = useState(true);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const containerRef = useRef(null);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!containerRef.current) return;
                    
                    const { clientX, clientY } = e;
                    const { innerWidth, innerHeight } = window;
                    
                    // 减小旋转幅度，增加高级稳重感
                    const x = (clientX - innerWidth / 2) / 60;
                    const y = (clientY - innerHeight / 2) / 60;
                    
                    setMousePos({ x, y });
                };

                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            const toggleMode = () => {
                setIsLogin(!isLogin);
            };

            return (
                <div className="min-h-screen w-full bg-[#0f172a] flex items-center justify-center overflow-hidden relative selection:bg-cyan-500 selection:text-white font-sans text-slate-800">
                
                {/* --- 动态背景层 --- */}
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-purple-900/40 rounded-full mix-blend-screen filter blur-[120px] animate-blob"></div>
                    <div className="absolute top-[20%] right-[-10%] w-[40%] h-[40%] bg-cyan-900/40 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-2000"></div>
                    <div className="absolute bottom-[-10%] left-[20%] w-[45%] h-[45%] bg-blue-900/30 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-4000"></div>
                    {/* 噪点纹理 */}
                    <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150 mix-blend-overlay"></div>
                </div>

                {/* --- 主 3D 容器 --- */}
                <div 
                    ref={containerRef}
                    className="relative w-full max-w-[1000px] min-h-[640px] transition-transform duration-200 ease-out perspective-1000 p-4"
                    style={{
                    transform: `perspective(1000px) rotateY(${mousePos.x}deg) rotateX(${-mousePos.y}deg)`,
                    }}
                >
                    {/* 玻璃拟态卡片主体 */}
                    <div className="relative w-full min-h-[640px] bg-white/5 backdrop-blur-3xl rounded-3xl shadow-[0_30px_60px_rgba(0,0,0,0.6)] border border-white/10 overflow-hidden flex ring-1 ring-white/5">
                    
                    {/* --- 左侧区域：登录表单 --- */}
                    <div className={`absolute top-0 left-0 w-1/2 h-full flex flex-col justify-center items-center px-16 transition-all duration-700 ease-in-out z-10 ${isLogin ? 'opacity-100 translate-x-0 pointer-events-auto' : 'opacity-0 translate-x-[-20%] pointer-events-none'}`}>
                        <div className="w-full max-w-[320px]">
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight drop-shadow-lg">欢迎归来</h2>
                        <p className="text-slate-400 mb-8 text-sm">连接到您的 Neural Net 账户</p>
                        
                        <div className="space-y-5">
                            <SocialButtons />
                            <div className="relative flex items-center py-2">
                            <div className="flex-grow border-t border-slate-700/50"></div>
                            <span className="flex-shrink-0 mx-4 text-slate-500 text-xs uppercase tracking-wider">Or continue with</span>
                            <div className="flex-grow border-t border-slate-700/50"></div>
                            </div>
                            <InputGroup icon={<Mail size={18} />} type="email" placeholder="电子邮箱" id="login-email" />
                            <InputGroup icon={<Lock size={18} />} type="password" placeholder="密码" id="login-pass" />
                            <div className="flex justify-between items-center text-xs mt-1">
                            <label className="flex items-center text-slate-400 hover:text-slate-300 cursor-pointer">
                                <input type="checkbox" className="mr-2 accent-cyan-500 rounded border-slate-700 bg-slate-800" /> 记住我
                            </label>
                            <span className="text-cyan-400 hover:text-cyan-300 cursor-pointer transition-colors">忘记密码?</span>
                            </div>
                            <GradientButton text="立即登录" />
                        </div>
                        </div>
                    </div>

                    {/* --- 右侧区域：注册表单 --- */}
                    <div className={`absolute top-0 right-0 w-1/2 h-full flex flex-col justify-center items-center px-16 transition-all duration-700 ease-in-out z-10 ${!isLogin ? 'opacity-100 translate-x-0 pointer-events-auto' : 'opacity-0 translate-x-[20%] pointer-events-none'}`}>
                        <div className="w-full max-w-[320px]">
                        <h2 className="text-4xl font-bold text-white mb-2 tracking-tight drop-shadow-lg">创建身份</h2>
                        <p className="text-slate-400 mb-8 text-sm">加入 10,000+ 赛博公民</p>
                        
                        <div className="space-y-5">
                            <SocialButtons />
                            <div className="relative flex items-center py-2">
                            <div className="flex-grow border-t border-slate-700/50"></div>
                            <span className="flex-shrink-0 mx-4 text-slate-500 text-xs uppercase tracking-wider">Or register with</span>
                            <div className="flex-grow border-t border-slate-700/50"></div>
                            </div>
                            <InputGroup icon={<User size={18} />} type="text" placeholder="用户名" id="reg-user" />
                            <InputGroup icon={<Mail size={18} />} type="email" placeholder="电子邮箱" id="reg-email" />
                            <InputGroup icon={<Lock size={18} />} type="password" placeholder="密码" id="reg-pass" />
                            <GradientButton text="注册账户" />
                        </div>
                        </div>
                    </div>

                    {/* --- 滑动遮罩层 --- */}
                    <div 
                        className={`absolute top-0 left-0 w-1/2 h-full overflow-hidden transition-transform duration-700 ease-in-out z-50 ${isLogin ? 'translate-x-[100%]' : 'translate-x-0'}`}
                    >
                        <div className="absolute inset-0 bg-gradient-to-br from-blue-600 via-purple-600 to-pink-600 text-white h-full w-full flex flex-col items-center justify-center overflow-hidden relative">
                        
                        {/* 跑马灯 */}
                        <div className="absolute inset-0 opacity-10 pointer-events-none overflow-hidden flex flex-col justify-between rotate-12 scale-125">
                            <MarqueeRow text="SYSTEM SECURE • ENCRYPTED DATA • NEURAL LINK •" speed="30s" direction="normal" />
                            <MarqueeRow text="ACCESS GRANTED • WELCOME USER • QUANTUM CORE •" speed="25s" direction="reverse" />
                            <MarqueeRow text="FUTURE AWAITS • JOIN THE GRID • DIGITAL LIFE •" speed="35s" direction="normal" />
                            <MarqueeRow text="CYBERPUNK AESTHETICS • HIGH VOLTAGE • NEON •" speed="40s" direction="reverse" />
                            <MarqueeRow text="SYSTEM SECURE • ENCRYPTED DATA • NEURAL LINK •" speed="30s" direction="normal" />
                        </div>

                        {/* 注册引导 */}
                        <div className={`relative z-10 w-full h-full flex flex-col items-center justify-center px-12 text-center transition-transform duration-700 ease-in-out ${isLogin ? 'translate-x-[-100%] opacity-0 absolute' : 'translate-x-0 opacity-100'}`}>
                            <div className="mb-6 p-4 bg-white/10 rounded-full backdrop-blur-md border border-white/20 shadow-xl">
                                <Globe size={40} className="text-white" />
                            </div>
                            <h1 className="text-3xl font-bold mb-4 drop-shadow-md">欢迎归队!</h1>
                            <p className="text-white/90 mb-8 leading-relaxed text-sm font-light tracking-wide">
                            已经拥有数字身份？<br/>请登录以同步您的云端数据。
                            </p>
                            <GhostButton text="去登录" onClick={toggleMode} />
                        </div>

                        {/* 登录引导 */}
                        <div className={`relative z-10 w-full h-full flex flex-col items-center justify-center px-12 text-center transition-transform duration-700 ease-in-out ${!isLogin ? 'translate-x-[100%] opacity-0 absolute' : 'translate-x-0 opacity-100'}`}>
                            <div className="mb-6 p-4 bg-white/10 rounded-full backdrop-blur-md border border-white/20 shadow-xl">
                                <Fingerprint size={40} className="text-white" />
                            </div>
                            <h1 className="text-3xl font-bold mb-4 drop-shadow-md">新的旅程?</h1>
                            <p className="text-white/90 mb-8 leading-relaxed text-sm font-light tracking-wide">
                            还没有账户？立即加入我们，<br/>解锁完整的高级功能体验。
                            </p>
                            <GhostButton text="去注册" onClick={toggleMode} />
                        </div>
                        
                        <div className="absolute bottom-4 left-0 w-full text-center">
                            <p className="text-[10px] uppercase tracking-[0.3em] opacity-40">System v2.0.4</p>
                        </div>

                        </div>
                    </div>

                    </div>
                </div>
                </div>
            );
        }

        // --- 子组件 ---

        const MarqueeRow = ({ text, speed, direction }) => {
            return (
                <div className="relative flex whitespace-nowrap overflow-hidden w-[200%]">
                <div 
                    className={`flex whitespace-nowrap ${direction === 'reverse' ? 'animate-scroll-reverse' : 'animate-scroll'}`}
                    style={{ animationDuration: speed }}
                >
                    <span className="text-5xl font-black uppercase text-white mx-4 tracking-tighter" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)', color: 'transparent' }}>{text}</span>
                    <span className="text-5xl font-black uppercase text-white mx-4 tracking-tighter" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)', color: 'transparent' }}>{text}</span>
                    <span className="text-5xl font-black uppercase text-white mx-4 tracking-tighter" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)', color: 'transparent' }}>{text}</span>
                    <span className="text-5xl font-black uppercase text-white mx-4 tracking-tighter" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.2)', color: 'transparent' }}>{text}</span>
                </div>
                </div>
            );
        }

        const InputGroup = ({ type, placeholder, icon, id }) => {
            const [isFocused, setIsFocused] = useState(false);

            return (
                <div className="relative w-full group">
                <label htmlFor={id} className="absolute -top-2 left-2 bg-[#0f172a] px-1 text-[10px] font-bold text-cyan-400 opacity-0 transition-all duration-300 scale-90 origin-left group-focus-within:opacity-100 group-focus-within:scale-100 group-focus-within:-translate-y-1 z-20 rounded">
                    {placeholder}
                </label>
                <div className={`absolute top-1/2 -translate-y-1/2 left-4 transition-colors duration-300 z-10 ${isFocused ? 'text-cyan-400' : 'text-slate-500'}`}>
                    {icon}
                </div>
                <input
                    id={id}
                    type={type}
                    placeholder={placeholder}
                    onFocus={() => setIsFocused(true)}
                    onBlur={() => setIsFocused(false)}
                    className={`w-full bg-slate-900/40 backdrop-blur-sm border rounded-xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-slate-500/70 outline-none transition-all duration-300 ${
                    isFocused 
                        ? 'border-cyan-400/50 shadow-[0_0_20px_rgba(34,211,238,0.15)] bg-slate-900/60' 
                        : 'border-slate-700/50 hover:border-slate-600 hover:bg-slate-900/50'
                    }`}
                />
                </div>
            );
        };

        const GradientButton = ({ text }) => {
            return (
                <button className="relative w-full py-3.5 rounded-xl font-bold text-white text-sm tracking-wide overflow-hidden group shadow-[0_10px_20px_rgba(0,0,0,0.2)] active:scale-[0.98] transition-transform duration-100">
                <div className="absolute inset-0 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 transition-all duration-300 group-hover:scale-[1.05] group-hover:brightness-110"></div>
                <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] skew-x-12"></div>
                <span className="relative flex items-center justify-center gap-2">
                    {text} <ArrowRight size={16} className="group-hover:translate-x-1 transition-transform" />
                </span>
                </button>
            );
        };

        const GhostButton = ({ text, onClick }) => {
            return (
                <button 
                onClick={onClick}
                className="px-10 py-3 bg-white/10 backdrop-blur-sm border border-white/40 rounded-full font-semibold text-white text-sm tracking-wide hover:bg-white hover:text-purple-600 transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg group"
                >
                <span className="flex items-center gap-2">
                    {text}
                </span>
                </button>
            )
        }

        const SocialButtons = () => {
            return (
                <div className="flex justify-center gap-4">
                <SocialIcon icon={<Github size={18} />} />
                <SocialIcon icon={<Twitter size={18} />} />
                <SocialIcon icon={<div className="font-bold text-sm">G</div>} />
                </div>
            );
        };

        const SocialIcon = ({ icon }) => {
            return (
                <button className="w-11 h-11 rounded-lg bg-slate-800/40 border border-slate-700/50 flex items-center justify-center text-slate-400 hover:bg-white hover:text-slate-900 hover:border-white hover:-translate-y-1 transition-all duration-300 shadow-md">
                {icon}
                </button>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
