<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="TravelMap - 赛博风旅行地图 Demo，涵盖 3D 地图、商城与路线规划体验。">
    <meta name="keywords" content="TravelMap, 旅行地图, 3D 地图, 安卓 Demo, AMap SDK">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:title" content="TravelMap 开屏引导页展示">
    <meta property="og:description" content="TravelMap 安卓 Demo，展示地图、商城与路线规划。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url_root }}">
    <meta name="twitter:card" content="summary">
    <title>TravelMap 开屏引导页展示</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Sky 500
                        primaryDark: '#0284c7', // Sky 600
                        secondary: '#0f172a', // Slate 900
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #e2e8f0;
        }

        /* 装饰性背景圆 */
        .blob {
            position: absolute;
            filter: blur(40px);
            z-index: 0;
            opacity: 0.6;
        }

        /* 简单的浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .animate-float-delay {
            animation: float 4s ease-in-out 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-10">

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-10">

        <!-- Banner 1: 探索 -->
        <div class="relative w-[375px] h-[812px] bg-white rounded-[40px] overflow-hidden shadow-2xl flex flex-col justify-between">
            <!-- 状态栏占位 -->
            <div class="h-12 w-full flex justify-between items-end px-6 pb-2 z-20">
                <span class="text-xs font-bold text-slate-800">9:41</span>
                <div class="flex space-x-1.5">
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-6 h-3 border-2 border-slate-800 rounded-md"></div>
                </div>
            </div>

            <!-- 跳过按钮 -->
            <div class="absolute top-12 right-6 z-20">
                <span class="text-slate-400 text-sm font-medium px-3 py-1 rounded-full border border-slate-200">跳过</span>
            </div>

            <!-- 插画区域 -->
            <div class="flex-1 flex items-center justify-center relative">
                <div class="blob w-64 h-64 bg-sky-100 rounded-full top-20 left-10"></div>
                <div class="relative z-10 w-64 h-64 animate-float">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 背景山峰 -->
                        <path d="M20 160L70 80L120 160H20Z" fill="#cbd5e1"/>
                        <path d="M80 160L140 60L200 160H80Z" fill="#94a3b8"/>
                        <!-- 太阳 -->
                        <circle cx="160" cy="40" r="20" fill="#fbbf24"/>
                        <!-- 云朵 -->
                        <path d="M30 50C30 50 40 30 60 40C60 40 70 25 90 40C90 40 100 40 100 50H30Z" fill="white" fill-opacity="0.8"/>
                        <!-- 放大镜图标 -->
                        <g transform="translate(60, 80)">
                            <circle cx="40" cy="40" r="35" stroke="#0ea5e9" stroke-width="8" fill="white" fill-opacity="0.5"/>
                            <path d="M65 65L85 85" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
                            <path d="M25 40L40 55L55 25" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- 文本区域 -->
            <div class="px-8 pb-16 text-center z-10">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">发现未知风景</h2>
                <p class="text-slate-500 leading-relaxed mb-10">
                    海量热门景点推荐，精选本地游玩攻略。<br>让每一次出发都充满灵感。
                </p>

                <!-- 指示器 -->
                <div class="flex justify-center gap-2 mb-8">
                    <div class="w-6 h-2 bg-primary rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                </div>

                <!-- 按钮 -->
                <button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg shadow-lg shadow-sky-200">
                    下一步
                </button>
            </div>
        </div>

        <!-- Banner 2: 导航 -->
        <div class="relative w-[375px] h-[812px] bg-white rounded-[40px] overflow-hidden shadow-2xl flex flex-col justify-between">
            <!-- 状态栏 -->
            <div class="h-12 w-full flex justify-between items-end px-6 pb-2 z-20">
                <span class="text-xs font-bold text-slate-800">9:41</span>
                <div class="flex space-x-1.5">
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-6 h-3 border-2 border-slate-800 rounded-md"></div>
                </div>
            </div>

            <div class="absolute top-12 right-6 z-20">
                <span class="text-slate-400 text-sm font-medium px-3 py-1 rounded-full border border-slate-200">跳过</span>
            </div>

            <!-- 插画区域 -->
            <div class="flex-1 flex items-center justify-center relative">
                <div class="blob w-64 h-64 bg-indigo-50 rounded-full bottom-20 right-10"></div>
                <div class="relative z-10 w-72 h-72 animate-float-delay">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 地图底座 -->
                        <path d="M20 100L100 60L180 100L100 140L20 100Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                        <path d="M20 100V120L100 160V140L20 100Z" fill="#cbd5e1"/>
                        <path d="M180 100V120L100 160V140L180 100Z" fill="#94a3b8"/>
                        <!-- 路径线 -->
                        <path d="M60 100C60 100 80 80 100 100C120 120 140 90 140 90" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="4 4"/>
                        <!-- 定位 Pin -->
                        <g transform="translate(90, 30)">
                            <path d="M10 0C4.48 0 0 4.48 0 10C0 17.5 10 28 10 28C10 28 20 17.5 20 10C20 4.48 15.52 0 10 0Z" fill="#ef4444"/>
                            <circle cx="10" cy="10" r="4" fill="white"/>
                        </g>
                        <!-- 小树装饰 -->
                        <circle cx="50" cy="110" r="5" fill="#22c55e"/>
                        <path d="M50 110V120" stroke="#15803d" stroke-width="2"/>
                        <circle cx="150" cy="90" r="6" fill="#22c55e"/>
                        <path d="M150 90V100" stroke="#15803d" stroke-width="2"/>
                    </svg>
                </div>
            </div>

            <!-- 文本区域 -->
            <div class="px-8 pb-16 text-center z-10">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">沉浸式 3D 导航</h2>
                <p class="text-slate-500 leading-relaxed mb-10">
                    集成高德地图 SDK，3D 视角呈现。<br>精准定位，带您轻松抵达每一个目的地。
                </p>

                <!-- 指示器 -->
                <div class="flex justify-center gap-2 mb-8">
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-6 h-2 bg-primary rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                </div>

                <!-- 按钮 -->
                <button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg shadow-lg shadow-sky-200">
                    下一步
                </button>
            </div>
        </div>

        <!-- Banner 3: 预订 -->
        <div class="relative w-[375px] h-[812px] bg-white rounded-[40px] overflow-hidden shadow-2xl flex flex-col justify-between">
            <div class="h-12 w-full flex justify-between items-end px-6 pb-2 z-20">
                <span class="text-xs font-bold text-slate-800">9:41</span>
                <div class="flex space-x-1.5">
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-6 h-3 border-2 border-slate-800 rounded-md"></div>
                </div>
            </div>

            <div class="absolute top-12 right-6 z-20">
                <span class="text-slate-400 text-sm font-medium px-3 py-1 rounded-full border border-slate-200">跳过</span>
            </div>

            <!-- 插画区域 -->
            <div class="flex-1 flex items-center justify-center relative">
                <div class="blob w-64 h-64 bg-orange-50 rounded-full top-40 right-20"></div>
                <div class="relative z-10 w-72 h-72 animate-float">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 手机框 -->
                        <rect x="60" y="40" width="80" height="140" rx="10" fill="white" stroke="#1e293b" stroke-width="4"/>
                        <!-- 屏幕内容 -->
                        <rect x="68" y="50" width="64" height="80" rx="4" fill="#f1f5f9"/>
                        <rect x="72" y="140" width="56" height="8" rx="4" fill="#0ea5e9"/>
                        <rect x="72" y="155" width="30" height="8" rx="4" fill="#cbd5e1"/>
                        <!-- 票券飞出 -->
                        <g transform="rotate(-15, 160, 80)">
                            <rect x="120" y="60" width="80" height="40" rx="4" fill="#f59e0b" stroke="white" stroke-width="2"/>
                            <circle cx="120" cy="80" r="6" fill="white"/>
                            <circle cx="200" cy="80" r="6" fill="white"/>
                            <path d="M150 60V100" stroke="white" stroke-width="2" stroke-dasharray="4 4"/>
                            <text x="155" y="85" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">TICKET</text>
                        </g>
                        <!-- 信用卡 -->
                        <rect x="20" y="120" width="70" height="45" rx="6" fill="#0f172a" transform="rotate(10)"/>
                        <circle cx="35" cy="135" r="6" fill="#fbbf24"/>
                        <rect x="30" y="150" width="30" height="4" rx="2" fill="#475569"/>
                    </svg>
                </div>
            </div>

            <!-- 文本区域 -->
            <div class="px-8 pb-16 text-center z-10">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">一站式行程预订</h2>
                <p class="text-slate-500 leading-relaxed mb-10">
                    景点门票、酒店住宿在线选购。<br>安全支付，极速出票，省心省力。
                </p>

                <div class="flex justify-center gap-2 mb-8">
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-6 h-2 bg-primary rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                </div>

                <button class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg shadow-lg shadow-sky-200">
                    下一步
                </button>
            </div>
        </div>

        <!-- Banner 4: 记录 -->
        <div class="relative w-[375px] h-[812px] bg-white rounded-[40px] overflow-hidden shadow-2xl flex flex-col justify-between">
            <div class="h-12 w-full flex justify-between items-end px-6 pb-2 z-20">
                <span class="text-xs font-bold text-slate-800">9:41</span>
                <div class="flex space-x-1.5">
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-4 h-4 bg-slate-800 rounded-full opacity-20"></div>
                    <div class="w-6 h-3 border-2 border-slate-800 rounded-md"></div>
                </div>
            </div>

            <!-- 最后一页不显示跳过 -->

            <!-- 插画区域 -->
            <div class="flex-1 flex items-center justify-center relative">
                <div class="blob w-64 h-64 bg-green-50 rounded-full top-10 left-20"></div>
                <div class="relative z-10 w-72 h-72 animate-float-delay">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 拍立得照片底框 -->
                        <rect x="50" y="40" width="100" height="120" rx="4" fill="white" stroke="#e2e8f0" stroke-width="2" transform="rotate(-5, 100, 100)"/>
                        <rect x="60" y="50" width="80" height="80" fill="#f1f5f9" transform="rotate(-5, 100, 100)"/>
                        <!-- 照片内容：山 -->
                        <path d="M60 110L80 80L100 110H60Z" fill="#cbd5e1" transform="rotate(-5, 100, 100) translate(10, 10)"/>
                         <!-- 心形 -->
                        <path d="M150 40C150 40 140 30 130 40C120 30 110 40 110 50C110 70 150 90 150 90C150 90 190 70 190 50C190 40 180 30 170 40C160 30 150 40 150 40Z" fill="#f43f5e" transform="scale(0.4) translate(250, 0)"/>
                        <!-- 评价星星 -->
                        <g transform="translate(60, 170)">
                            <path d="M10 0L13 7H20L15 12L17 19L10 15L3 19L5 12L0 7H7L10 0Z" fill="#fbbf24"/>
                            <path d="M35 0L38 7H45L40 12L42 19L35 15L28 19L30 12L25 7H32L35 0Z" fill="#fbbf24"/>
                            <path d="M60 0L63 7H70L65 12L67 19L60 15L53 19L55 12L50 7H57L60 0Z" fill="#fbbf24"/>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- 文本区域 -->
            <div class="px-8 pb-16 text-center z-10">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">珍藏美好足迹</h2>
                <p class="text-slate-500 leading-relaxed mb-10">
                    记录打卡过的每一个地点。<br>收藏回忆，分享您的旅行故事。
                </p>

                <div class="flex justify-center gap-2 mb-8">
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-2 h-2 bg-slate-200 rounded-full"></div>
                    <div class="w-6 h-2 bg-primary rounded-full"></div>
                </div>

                <button class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-lg shadow-lg shadow-slate-300 hover:scale-[1.02] transition-transform">
                    开始探索
                </button>
            </div>
        </div>

    </div>

</body>
</html>
