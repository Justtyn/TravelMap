    <!-- Lucide React Shim: Converts vanilla icons to React components -->
    <script>
        window.initLucideReact = function() {
            if (typeof lucide === 'undefined') {
                console.error("Lucide library failed to load");
                return {};
            }

            const { createElement } = React;
            const icons = {};

            // Helper to convert abstract node tree to React Elements
            const renderNode = ([tag, attrs, children]) => {
                const props = { ...attrs, key: attrs.key || Math.random() };
                // Convert class to className for React
                if (props.class) {
                    props.className = props.class;
                    delete props.class;
                }
                // Recursively render children
                const childElements = children ? children.map(renderNode) : [];
                return createElement(tag, props, ...childElements);
            };

            // Generate React components for each icon
            Object.keys(lucide.icons).forEach(name => {
                const iconData = lucide.icons[name];
                icons[name] = ({ color = "currentColor", size = 24, strokeWidth = 2, className, ...props }) => {
                    const [tag, attrs, children] = iconData;

                    const svgProps = {
                        ...attrs,
                        width: size,
                        height: size,
                        stroke: color,
                        strokeWidth: strokeWidth,
                        className: `lucide lucide-${name} ${className || ''}`,
                        ...props
                    };

                    if (svgProps.class) {
                        svgProps.className = `${svgProps.className} ${svgProps.class}`.trim();
                        delete svgProps.class;
                    }

                    return createElement(
                        tag,
                        svgProps,
                        children ? children.map(renderNode) : []
                    );
                };
            });

            return icons;
        };
    </script>
